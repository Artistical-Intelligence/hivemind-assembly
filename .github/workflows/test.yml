name: Hivemind Assembly contracts
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - name: Install Linux cross compiler and native game test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld libsdl2-dev xvfb
      - name: Fetch pinned Godot for native adapter tests
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "HA_TEST_GODOT=$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Prepare pinned ARM64 loader fixture
        run: |
          python -m pip install zstandard==0.25.0
          python dev/prepare_arm64_fixture.py
          python -c "import shutil; assert shutil.which('clang') and shutil.which('ld.lld'), 'Clang and LLD required'"
      - name: Check native Windows execution
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_tool_testing.py::test_native_compiled_reconstruction tests/test_tool_testing.py::test_repeatability_crash_and_output_limits tests/test_tool_testing.py::test_process_timeout_tree_and_no_ambient_credentials tests/test_native_cleanup.py tests/test_windows_program.py::test_native_windows_pe_oracle tests/test_windows_files.py::test_native_windows_file_oracle tests/test_windows_process.py::test_native_windows_process_oracle tests/test_windows_memory.py::test_native_windows_memory_oracle tests/test_program_libc.py::test_native_windows_memory_execution -q --junitxml=compiler-results.xml
      - run: python -m pytest tests -q --junitxml=contract-results.xml
        env:
          # Linux fetches the pinned public benchmark from GitHub and checks it.
          HA_BENCHMARK_FETCH: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Retain contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-results-${{ runner.os }}-${{ github.run_id }}
          path: |
            contract-results.xml
            compiler-results.xml
          retention-days: 3
          if-no-files-found: warn
      - run: python _app/launch.py verify
  browser-fixture:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: python -m playwright install --with-deps chromium
      - name: Exercise local DOM transport fixture
        run: |
          export WORKBENCH_TEST_CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m pytest tests/test_browser_fixture.py tests/test_dashboard_browser.py -q --junitxml=browser-results.xml
      - name: Retain browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ github.run_id }}
          path: browser-results.xml
          retention-days: 3
  windows-package:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify release archives and installer
        shell: pwsh
        run: ./dev/package_windows.ps1 -Output "${{ runner.temp }}/ha-packages"
      - name: Install and exercise the packaged runtime
        shell: pwsh
        run: |
          $archive = (Get-ChildItem "$env:RUNNER_TEMP/ha-packages/*Windows.zip").FullName
          $release = "$env:RUNNER_TEMP/HA package with spaces"
          $data = "$env:RUNNER_TEMP/HA persistent data"
          Expand-Archive -LiteralPath $archive -DestinationPath $release
          $app = "$release/Hivemind_Assembly"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$app/_app/Start.ps1" -DataRoot $data -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'First-launch verification failed' }
          & "$data/runtime-python312/python.exe" dev/check_package.py $app $data prepare
          if ($LASTEXITCODE -ne 0) { throw 'Packaged project workflow failed' }
          Remove-Item -Recurse -Force $release
          Expand-Archive -LiteralPath $archive -DestinationPath $release
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$app/_app/Start.ps1" -DataRoot $data -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Updated launcher verification failed' }
          & "$data/runtime-python312/python.exe" dev/check_package.py $app $data verify-update
          if ($LASTEXITCODE -ne 0) { throw 'Update or backup restoration lost project data' }
      - name: Retain verified installation packages
        uses: actions/upload-artifact@v4
        with:
          name: Hivemind-Assembly-packages-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ha-packages/*.zip
            ${{ runner.temp }}/ha-packages/*_Setup.exe
          retention-days: 14
          if-no-files-found: error
