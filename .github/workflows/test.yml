name: Hivemind Assembly contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - run: python -m pytest tests -q
      - run: python _app/launch.py verify
  browser-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - name: Exercise local DOM transport fixture
        run: |
          export WORKBENCH_TEST_CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m pytest tests/test_browser_fixture.py -q
