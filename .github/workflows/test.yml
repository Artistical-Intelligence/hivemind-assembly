name: Hivemind Assembly contracts
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - run: python -m pytest tests -q --junitxml=contract-results.xml
      - name: Retain contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-results-${{ runner.os }}-${{ github.run_id }}
          path: contract-results.xml
          retention-days: 3
          if-no-files-found: warn
      - run: python _app/launch.py verify
  browser-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - name: Exercise local DOM transport fixture
        run: |
          export WORKBENCH_TEST_CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m pytest tests/test_browser_fixture.py -q
