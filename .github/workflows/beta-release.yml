name: Publish owner-testing HA beta
# Explicit owner-authorized testing prerelease. The stable release workflow and
# all pending independent-review markers remain unchanged.
on:
  push:
    paths:
      - '.github/workflows/beta-release.yml'
      - 'dev/beta_release_request.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ha-owner-beta-0.38.0-beta.1
  cancel-in-progress: false
jobs:
  build-and-install:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ORT_DISABLE_TELEMETRY: '1'
      HA_SKIP_HELPER_REGISTRATION: '1'
      HA_MEANING_SEARCH: '0'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify beta request and packaging regressions
        shell: pwsh
        run: |
          $request = Get-Content dev/beta_release_request.json -Raw | ConvertFrom-Json
          if ($request.version -ne '0.38.0-beta.1' -or -not $request.owner_testing_beta_authorized -or $request.channel -ne 'beta') { throw 'This workflow is limited to the explicitly requested testing beta' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ha-beta-output" | Out-Null
          python -m pip --isolated install pytest
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies failed' }
          python -m pytest tests/test_beta_packaging.py tests/test_integration_document_scope.py tests/test_status_docs.py -q --junitxml="$env:RUNNER_TEMP/ha-beta-output/beta-tests.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Beta packaging or document regressions failed' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 41238262130
          name: HA-offline-recheck-cc02d1cbfa1b5b2ae9c450b883dc0ede38537138
          path: ${{ runner.temp }}/ha-beta-input
      - name: Stage exact tested runtime with current evidence and beta identity
        shell: pwsh
        run: |
          python dev/package_beta.py --inputs "$env:RUNNER_TEMP/ha-beta-input" --stage "$env:RUNNER_TEMP/ha-beta-stage" --output "$env:RUNNER_TEMP/ha-beta-output"
          if ($LASTEXITCODE -ne 0) { throw 'Source identity or complete offline input verification failed' }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/ha-beta-input"
      - name: Compile the complete offline installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler unavailable' }
          }
          & $iscc '/DAppVersion=0.38.0-beta.1' "/DSourceDir=$env:RUNNER_TEMP/ha-beta-stage/Hivemind_Assembly" "/DOutputDir=$env:RUNNER_TEMP/ha-beta-output" "$env:RUNNER_TEMP/ha-beta-output/beta-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Beta installer build failed' }
      - name: Install and test the actual beta offline; verify upgrade and data preservation
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ha-beta-output'
          $setup = Join-Path $output 'Hivemind_Assembly_0.38.0-beta.1_Setup.exe'
          $installed = Join-Path $env:RUNNER_TEMP 'HA beta installed with spaces'
          $root = Join-Path $env:RUNNER_TEMP 'ha-beta-clean-user-data'
          if ((Test-Path $root) -or (Test-Path $installed)) { throw 'The beta test requires fresh directories' }
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NOICONS', "/DIR=`"$installed`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Beta installation failed: $($p.ExitCode)" }
          $app = Join-Path $installed '_app'
          $programsJson = python dev/verify_offline_install.py --app-root $app --data-root $root --programs
          if ($LASTEXITCODE -ne 0) { throw 'Installed offline inventory failed' }
          $programs = @($programsJson | ConvertFrom-Json)
          $rules = @()
          $group = 'HA-owner-beta-' + $env:GITHUB_RUN_ID
          $external = @('0.0.0.0-126.255.255.255', '128.0.0.0-255.255.255.255', '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
          try {
            foreach ($program in $programs) {
              $name = $group + '-' + $rules.Count
              New-NetFirewallRule -Name $name -DisplayName $name -Group $group -Direction Outbound -Action Block -Program $program -RemoteAddress $external -Profile Any -ErrorAction Stop | Out-Null
              $rules += $name
            }
            $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $app 'browsers'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $app 'Start.ps1') -DataRoot $root -PrepareOnly
            if ($LASTEXITCODE -ne 0) { throw 'Installed local-only bootstrap failed' }
            # Include executable helpers installed from the retained Python wheels.
            foreach ($program in (Get-ChildItem $root -Recurse -File -Filter '*.exe' | Select-Object -ExpandProperty FullName)) {
              if ($programs -notcontains $program) {
                $name = $group + '-' + $rules.Count
                New-NetFirewallRule -Name $name -DisplayName $name -Group $group -Direction Outbound -Action Block -Program $program -RemoteAddress $external -Profile Any -ErrorAction Stop | Out-Null
                $rules += $name
              }
            }
            $python = Join-Path $root 'runtime-python312/python.exe'
            & $python dev/verify_offline_install.py --app-root $app --data-root $root --report (Join-Path $output 'offline-acceptance.json')
            if ($LASTEXITCODE -ne 0) { throw 'Installed beta failed real offline acceptance' }
          } finally {
            foreach ($name in $rules) { Remove-NetFirewallRule -Name $name -ErrorAction Continue }
          }
          $settings = Join-Path $root 'settings.json'
          $settingsHash = (Get-FileHash $settings -Algorithm SHA256).Hash
          $canary = Join-Path $root 'private/offline-preservation-canary.txt'
          $canaryHash = (Get-FileHash $canary -Algorithm SHA256).Hash
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NOICONS', "/DIR=`"$installed`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Beta reinstall failed' }
          if ((Get-FileHash $settings -Algorithm SHA256).Hash -ne $settingsHash -or (Get-FileHash $canary -Algorithm SHA256).Hash -ne $canaryHash) { throw 'Reinstall changed retained user data' }
          $uninstaller = (Get-ChildItem $installed -Filter 'unins*.exe' | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Beta uninstall failed' }
          for ($i = 0; $i -lt 120 -and (Test-Path $app); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw 'Uninstall left application files behind' }
          if ((Get-FileHash $settings -Algorithm SHA256).Hash -ne $settingsHash -or (Get-FileHash $canary -Algorithm SHA256).Hash -ne $canaryHash) { throw 'Uninstall changed retained user data' }
          @{ passed=$true; version='0.38.0-beta.1'; commit=$env:GITHUB_SHA; clean_install=$true; reinstall=$true; uninstall=$true; user_data_preserved=$true; owner_desktop_test=$false; independent_review_complete=$false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'installer-acceptance.json')
          python dev/package_beta.py --output $output --finalize
          if ($LASTEXITCODE -ne 0) { throw 'Beta asset checks failed' }
      - name: Retain small build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HA-beta-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ha-beta-output/*.json
            ${{ runner.temp }}/ha-beta-output/*.xml
            ${{ runner.temp }}/ha-beta-output/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Hand only passing assets to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HA-beta-publish-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ha-beta-output/*_Setup.exe
            ${{ runner.temp }}/ha-beta-output/*_Setup-*.bin
            ${{ runner.temp }}/ha-beta-output/SHA256SUMS.txt
            ${{ runner.temp }}/ha-beta-output/BETA_README.md
            ${{ runner.temp }}/ha-beta-output/build-provenance.json
            ${{ runner.temp }}/ha-beta-output/offline-acceptance.json
            ${{ runner.temp }}/ha-beta-output/installer-acceptance.json
            ${{ runner.temp }}/ha-beta-output/beta-tests.xml
            ${{ runner.temp }}/ha-beta-output/release-notes.md
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  publish-prerelease:
    needs: build-and-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: HA-beta-publish-${{ github.sha }}
          path: beta
      - name: Publish an immutable-name beta without replacing the stable release
        working-directory: beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          provenance = json.loads(Path('build-provenance.json').read_text())
          acceptance = json.loads(Path('installer-acceptance.json').read_text(encoding='utf-8-sig'))
          assert provenance['version'] == '0.38.0-beta.1'
          assert provenance['release_source_commit'] == os.environ['SOURCE_SHA']
          assert provenance['stable_release_approved'] is False
          assert acceptance['passed'] is True and acceptance['commit'] == os.environ['SOURCE_SHA']
          assert json.loads(Path('offline-acceptance.json').read_text())['passed'] is True
          PY
          tag='v0.38.0-beta.1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This beta already exists. Refusing to overwrite its files.' >&2
            exit 1
          fi
          gh release create "$tag" --target "$SOURCE_SHA" --title "Hivemind Assembly $tag — unified offline beta" --notes-file release-notes.md --draft --prerelease --latest=false
          gh release upload "$tag" *_Setup.exe *_Setup-*.bin SHA256SUMS.txt BETA_README.md build-provenance.json offline-acceptance.json installer-acceptance.json beta-tests.xml
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,assets
