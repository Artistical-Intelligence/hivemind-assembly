name: HA native Chat Mode event contracts (no model API)
on:
  push:
    paths:
      - '.github/workflows/chatmode-native-events.yml'
      # Include the event-effect bridge and later event/ticket modules.
      - '_app/hivemind_assembly/automation/event_*.py'
      - '_app/hivemind_assembly/automation/ticket_*.py'
      - '_app/hivemind_assembly/automation/progress_watchdog.py'
      - '_app/hivemind_assembly/automation/github_event_adapter.py'
      - '_app/hivemind_assembly/automation/grokbot_event_adapter.py'
      - '_app/hivemind_assembly/automation/team.py'
      - '_app/hivemind_assembly/core/durable_effects.py'
      - '_app/hivemind_assembly/integrations/mcp.py'
      - 'tests/test_native_event_inbox.py'
      - 'tests/test_progress_watchdog.py'
      - 'tests/test_github_event_adapter.py'
      - 'tests/test_grokbot_event_adapter.py'
      - 'tests/test_native_browser_event_transport.py'
      - 'tests/test_core_durable_effects.py'
      - 'tests/test_mcp_inline_text.py'
      - 'tests/test_mcp_connections.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-event-tests:
    # Preserve evidence from both platforms when one side fails.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Pinned upstream v5: Node 24; avoid mutable tag and Node 20 deprecation.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # Pinned upstream v6: Node 24.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install HA Python dependencies without model/API credentials
        run: python -m pip install -r _app/requirements.txt pytest
      - name: Run deterministic event and watchdog contracts
        env:
          HA_SKIP_HELPER_REGISTRATION: '1'
          HA_MEANING_SEARCH: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q tests/test_native_event_inbox.py tests/test_progress_watchdog.py tests/test_github_event_adapter.py tests/test_grokbot_event_adapter.py tests/test_native_browser_event_transport.py tests/test_mcp_inline_text.py tests/test_mcp_connections.py tests/test_core_durable_effects.py --junitxml=native-events.xml
      - name: Retain exact test results
        if: always()
        # Pinned upstream v6: Node 24, preserved 7-day JUnit evidence.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-event-contracts-${{ matrix.os }}-${{ github.run_id }}
          path: native-events.xml
          retention-days: 7
          if-no-files-found: warn

  browser-fixture-supported-runner:
    # Diagnostic mirror of test.yml browser-fixture, pinned to an OS supported
    # by the repository's current Playwright 1.58.0 (ubuntu-latest is 26.04).
    # This is LOCAL DOM fixture evidence, not live provider/browser acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing HA browser fixture prerequisites
        run: |
          python -m pip install -r _app/requirements.txt pytest
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Install Chromium on supported Ubuntu 24.04
        run: python -m playwright install --with-deps chromium
      - name: Run existing local DOM transport and dashboard/browser action tests
        env:
          HA_SKIP_HELPER_REGISTRATION: '1'
          HA_MEANING_SEARCH: '0'
          HA_TEST_NAVIGATION: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export WORKBENCH_TEST_CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m pytest -q tests/test_browser_fixture.py tests/test_dashboard_browser.py tests/test_ha_browser_actions.py --junitxml=native-browser-fixture.xml
      - name: Retain local browser fixture JUnit results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-browser-fixture-ubuntu-24.04-${{ github.run_id }}
          path: native-browser-fixture.xml
          retention-days: 7
          if-no-files-found: warn
