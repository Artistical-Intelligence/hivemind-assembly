name: Unified HA integration checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'dev/apply_ha_unification.py'
      - '.github/workflows/unified-ha.yml'
permissions:
  contents: read
concurrency:
  group: ha-unified-integration
  cancel-in-progress: false
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source-fenced changes, preserving all user data
        run: |
          git config user.name 'HA source integration'
          git config user.email '193562052+Artistical-Intelligence@users.noreply.github.com'
          python dev/apply_ha_unification.py --commit
      - id: revision
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  generate:
    needs: wire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wire.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ha-integration-source-inputs-41135554213
          run-id: 41135554213
          github-token: ${{ github.token }}
          path: input-archives
      - name: Expand only verified browser inputs
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          for name, expected in [('opencli', '3e73b01df9dd35c9d7def08d5b5a15f2e3c34610644ffa16450f82b3c94283db'), ('agent-reach', '1b6d725a0dfc18be10483abd018427c327c537478c51d0fd0ac531e3fe6c433b')]:
              paths = list(pathlib.Path('input-archives').glob(name + '-*.zip'))
              if len(paths) != 1: raise RuntimeError('Missing or ambiguous pinned source')
              path = paths[0]
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected: raise RuntimeError('Pinned source mismatch')
              target = pathlib.Path('source-inputs/' + name).resolve(); target.mkdir(parents=True)
              with zipfile.ZipFile(path) as archive:
                  if sum(i.file_size for i in archive.infolist()) > 256 * 1024 * 1024: raise RuntimeError('Expanded source too large')
                  for item in archive.infolist():
                      if not (target / item.filename).resolve().is_relative_to(target): raise RuntimeError('Unsafe path')
                      if (item.external_attr >> 16) & 0o170000 == 0o120000: raise RuntimeError('Unexpected symlink')
                  archive.extractall(target)
      - name: Build embedded assets without upstream installation hooks
        run: |
          npm install --prefix "$RUNNER_TEMP/ha-compiler" --ignore-scripts --no-audit --no-fund typescript@5.8.3
          export PATH="$RUNNER_TEMP/ha-compiler/node_modules/.bin:$PATH"
          python dev/ingest_automation.py source-inputs/opencli/OpenCLI-97dc0cd5214b9602bcda78d7422f231ee8a803e9 source-inputs/agent-reach/Agent-Reach-14c213405669414492bda0f8d52cc6531d062c45 generated/browser_engine
      - uses: actions/upload-artifact@v4
        with:
          name: ha-embedded-browser-${{ github.run_id }}
          path: generated/browser_engine/
          if-no-files-found: error
          retention-days: 14
  retain:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: ha-embedded-browser-${{ github.run_id }}
          path: staged-browser-engine
      - name: Verify existing generated files before replacing them
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          target = pathlib.Path('_app/hivemind_assembly/automation/browser_engine')
          manifest = target / 'manifest.json'
          if not manifest.is_file(): raise RuntimeError('Missing retained baseline manifest')
          for name, digest in json.loads(manifest.read_text())['generated'].items():
              path = target / name
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest: raise RuntimeError('Reconcile changed generated files first')
          for path in pathlib.Path('staged-browser-engine').rglob('*'):
              if path.is_file():
                  dst = target / path.relative_to('staged-browser-engine')
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, dst)
      - name: Save each changed source file with pending review retained
        run: |
          set -euo pipefail
          git config user.name 'HA source integration'
          git config user.email '193562052+Artistical-Intelligence@users.noreply.github.com'
          while IFS= read -r -d '' path; do
            git add -- "$path"
            if ! git diff --cached --quiet; then
              git commit -m "Update embedded HA browser source: ${path##*/}"
              git push origin HEAD:main
            fi
          done < <(find _app/hivemind_assembly/automation/browser_engine -type f -print0 | sort -z)
      - id: revision
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    needs: retain
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.retain.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - name: Internal storage, private access and application regression checks
        run: python -m pytest tests/test_ha_owned_state.py tests/test_hermes_board.py tests/test_ha_remote_access.py tests/test_ha_browser_actions.py tests/test_app.py tests/test_architecture.py -q --junitxml=unified-results.xml
      - run: python dev/status_docs.py --check
      - name: Retain exact test evidence without approving a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-unified-${{ runner.os }}-${{ github.run_id }}
          path: unified-results.xml
          retention-days: 14
          if-no-files-found: warn
  browser:
    needs: retain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.retain.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _app/requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - name: Actual navigation, browser actions and existing dashboard regressions
        run: |
          export WORKBENCH_TEST_CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export HA_TEST_NAVIGATION=1
          python -m pytest tests/test_ha_browser_actions.py tests/test_dashboard_browser.py -q --junitxml=unified-browser-results.xml
      - name: Retain browser evidence without live-provider claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-unified-browser-${{ github.run_id }}
          path: unified-browser-results.xml
          retention-days: 14
          if-no-files-found: warn
