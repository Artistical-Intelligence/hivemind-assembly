name: Build HA owned components
on:
  push:
    paths:
      - '.github/workflows/owned-components.yml'
      - 'dev/build_owned_analysis.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the pinned internal analysis runtime
        run: python dev/build_owned_analysis.py "${{ runner.temp }}/ha-components"
        env:
          DO_NOT_TRACK: '1'
          TURBO_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: HA-analysis-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ha-components/
          retention-days: 14
          if-no-files-found: error
  windows-wheels:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the existing hash-locked Windows dependencies
        run: python -m pip download --only-binary=:all: --require-hashes --no-deps --find-links _app/bootstrap/wheels -r _app/requirements-windows.lock --dest "${{ runner.temp }}/ha-wheels"
      - name: Retain the lock with the artifacts
        shell: pwsh
        run: Copy-Item _app/requirements-windows.lock "$env:RUNNER_TEMP/ha-wheels/requirements-windows.lock"
      - uses: actions/upload-artifact@v4
        with:
          name: HA-offline-wheels-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/ha-wheels/
          retention-days: 14
          if-no-files-found: error
  linux-check-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve missing local-check dependencies for the isolated workbench
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ha-check-wheels"
          python -m pip download --only-binary=:all: --find-links _app/bootstrap/wheels --dest "$RUNNER_TEMP/ha-check-wheels" pefile==2024.8.26 pypcode==4.0.1 unicorn==2.1.4 z3-solver==5.3.1.0 qiling==1.4.6 speakeasy-emulator==2.0.0b9 mcp==2.3.0 keyring==25.6.0 onnxruntime==1.31.1
      - uses: actions/upload-artifact@v4
        with:
          name: HA-local-check-wheels-Linux-${{ github.sha }}
          path: ${{ runner.temp }}/ha-check-wheels/
          retention-days: 14
          if-no-files-found: error
