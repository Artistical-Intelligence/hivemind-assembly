name: Build HA owned components
on:
  push:
    paths:
      - '.github/workflows/owned-components.yml'
      - 'dev/build_owned_analysis.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install the donor's required cross compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Build the exact Windows safety helper from source
        run: python dev/build_owned_analysis.py "$RUNNER_TEMP/ha-native-helper" --native-only
      - uses: actions/upload-artifact@v4
        with:
          name: HA-analysis-native-${{ github.sha }}
          path: ${{ runner.temp }}/ha-native-helper/
          retention-days: 14
          if-no-files-found: error
  analysis:
    needs: windows-native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: HA-analysis-native-${{ github.sha }}
          path: ${{ runner.temp }}/ha-native-helper
      - name: Compile the pinned internal analysis runtime
        run: |
          python dev/build_owned_analysis.py "${{ runner.temp }}/ha-components" --native-input "${{ runner.temp }}/ha-native-helper"
        env:
          DO_NOT_TRACK: '1'
          TURBO_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: HA-analysis-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ha-components/
          retention-days: 14
          if-no-files-found: error
  windows-wheels:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the existing hash-locked Windows dependencies
        run: |
          python -m pip download --only-binary=:all: --require-hashes --no-deps --find-links _app/bootstrap/wheels -r _app/requirements-windows.lock --dest "${{ runner.temp }}/ha-wheels"
      - name: Retain the lock with the artifacts
        shell: pwsh
        run: |
          Copy-Item _app/requirements-windows.lock "$env:RUNNER_TEMP/ha-wheels/requirements-windows.lock"
      - uses: actions/upload-artifact@v4
        with:
          name: HA-offline-wheels-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/ha-wheels/
          retention-days: 14
          if-no-files-found: error
