name: Publish release
# Publishes the current version as a GitHub Release with a permanent download
# link. Runs after the full contract suite passes on main (only when that
# version has no release yet), or on a pushed version tag, or manually.
on:
  workflow_run:
    workflows: ['Hivemind Assembly contracts']
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example v0.25.1); created at the selected commit if missing
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-release:
    # A workflow_run release must come from a passing push to this repository's
    # main branch, never from a pull request (a fork can name its branch main).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Decide whether this version needs a release
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content _app/release_status.json -Raw | ConvertFrom-Json).version
          $tag = if ('${{ inputs.tag }}') { '${{ inputs.tag }}' } elseif ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          gh release view $tag 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $publish = -not $exists -or '${{ github.event_name }}' -ne 'workflow_run'
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, tag $tag, release exists: $exists, publish: $publish"
          # gh exits 1 when the release does not exist yet; that is an answer, not a failure.
          exit 0
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Refuse while anything is marked checks pending
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: python dev/checks_gate.py
      - name: Check the tag matches the release version
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = '${{ steps.plan.outputs.tag }}'
          $version = (Get-Content _app/release_status.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw "Tag $tag does not match release_status.json version $version" }
      - name: Build, install and verify packages
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: ./dev/package_windows.ps1 -Output "${{ runner.temp }}/ha-release"
      - name: Publish GitHub Release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.plan.outputs.tag }}'
          $files = Get-ChildItem "${{ runner.temp }}/ha-release" | Where-Object { $_.Name -match '_Setup\.exe$' }
          $sums = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name }
          $notes = @(
            "Download **$($files | Where-Object Name -like '*_Setup.exe' | Select-Object -ExpandProperty Name)** and run it. It installs for your Windows user without administrator rights and adds a Start menu shortcut.",
            "",
            "The installer is not code-signed, so Windows SmartScreen may warn: choose **More info -> Run anyway**.",
            "Updating: run the newer installer; projects and settings in your local application data folder are kept. Uninstalling also keeps them.",
            "The installer lets you choose the installation folder. The source code is in the repository and in GitHub's automatic source downloads below.",
            "",
            "Evidence and remaining live acceptance are listed in README (Current evidence) for this exact commit.",
            "",
            "SHA-256:",
            '```',
            ($sums -join "`n"),
            '```'
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @($files.FullName) --clobber
          } else {
            gh release create $tag @($files.FullName) --target '${{ github.event.workflow_run.head_sha || github.sha }}' --title "Hivemind Assembly $tag" --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
