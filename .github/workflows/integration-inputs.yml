name: Preserve integration inputs
on:
  push:
    paths:
      - '.github/workflows/integration-inputs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact donor sources without running their code
        run: python dev/acquire_donor_sources.py "$RUNNER_TEMP/ha-donor-sources"
      - uses: actions/upload-artifact@v4
        with:
          name: HA-donor-sources-${{ github.sha }}
          path: ${{ runner.temp }}/ha-donor-sources/
          retention-days: 14
          if-no-files-found: error
