name: HA integration source inputs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integration-inputs.yml'
permissions:
  contents: read
concurrency:
  group: ha-integration-inputs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download immutable source snapshots (no upstream execution)
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request
          sources = {
              'hermes': ('NousResearch/hermes-agent', 'c0015464f0f40d52c5702a84cf58e70361f4a04c'),
              'rea': ('morluto/rea', 'ca71e91d23672646af917ede8ae82c7fea395341'),
              't3': ('pingdotgg/t3code', '08a463e29976617134de01e9341f898bc881d0eb'),
              'agent-reach': ('Panniantong/Agent-Reach', '14c213405669414492bda0f8d52cc6531d062c45'),
              'opencli': ('jackwener/OpenCLI', '97dc0cd5214b9602bcda78d7422f231ee8a803e9'),
              'codex': ('openai/codex', '4bc746c94fce95ec7ca5f1a91a786156d240c8a2'),
          }
          root = pathlib.Path('integration-inputs'); root.mkdir()
          records = []
          for name, (repo, commit) in sources.items():
              url = f'https://codeload.github.com/{repo}/zip/{commit}'
              request = urllib.request.Request(url, headers={'User-Agent': 'HA-source-preservation'})
              target = root / f'{name}-{commit}.zip'
              with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as out:
                  count = 0; sha = hashlib.sha256()
                  while chunk := response.read(1024 * 1024):
                      count += len(chunk)
                      if count > 512 * 1024 * 1024:
                          raise RuntimeError('Source archive exceeds acquisition bound')
                      out.write(chunk); sha.update(chunk)
              records.append({'name': name, 'repository': repo, 'commit': commit, 'url': url,
                              'filename': target.name, 'bytes': count, 'sha256': sha.hexdigest()})
              print(name, commit, count, sha.hexdigest())
          (root / 'provenance.json').write_text(json.dumps({'executed': False, 'sources': records}, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: ha-integration-source-inputs-${{ github.run_id }}
          path: integration-inputs/
          if-no-files-found: error
          retention-days: 14
