name: Build HA internal execution
on:
  push:
    paths:
      - '.github/workflows/internal-execution.yml'
      - 'dev/build_internal_execution.py'
      - 'dev/internal_execution_main.rs'
      - '_app/hivemind_assembly/core/execution.py'
      - '_app/hivemind_assembly/core/jobs.py'
      - 'tests/test_internal_execution.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the donor's pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the selected runtime and retain its offline source dependencies
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: python dev/build_internal_execution.py "$RUNNER_TEMP/ha-execution"
      - name: Prepare the actual component with HA integrity checks
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('_app').resolve()))
          from hivemind_assembly.application.components import Components, host_platform
          folder = Path(os.environ['RUNNER_TEMP']) / 'ha-execution'
          record = json.loads((folder / ('execution-' + host_platform() + '-artifact.json')).read_text())
          (folder / 'catalogue.json').write_text(json.dumps({'schema':1,'components':[record]}))
          owned = Components(Path(os.environ['RUNNER_TEMP']) / 'execution-test-state', folder)
          owned.prepare(['execution'])
          component = owned.resolve('execution')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('HA_TEST_EXECUTION=' + str(component.entrypoint) + '\n')
          PY
      - name: Run protocol and actual process lifecycle tests
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest tests/test_internal_execution.py -q --junitxml="$RUNNER_TEMP/ha-execution/process-tests.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HA-execution-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ha-execution/
          retention-days: 14
          if-no-files-found: error
