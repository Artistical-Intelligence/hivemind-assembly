name: HA owned runtime regression
on:
  push:
    paths:
      - '.github/workflows/owned-runtime-recheck.yml'
      - 'dev/owned_runtime_recheck_request.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ha-owned-runtime-recheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      ORT_DISABLE_TELEMETRY: '1'
      HA_SKIP_HELPER_REGISTRATION: '1'
      HA_MEANING_SEARCH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41234564595
          name: HA-execution-${{ runner.os }}-9b03df2014d0b314ca9869d3cc4f24e2b62ceac0
          path: ${{ runner.temp }}/owned-runtime
      - name: Authenticate the retained helper with HA's component installer
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('_app').resolve()))
          from hivemind_assembly.application.components import Components, host_platform
          folder = Path(os.environ['RUNNER_TEMP']) / 'owned-runtime'
          record = json.loads((folder / ('execution-' + host_platform() + '-artifact.json')).read_text())
          (folder / 'catalogue.json').write_text(json.dumps({'schema':1,'components':[record]}))
          owned = Components(Path(os.environ['RUNNER_TEMP']) / 'runtime-test-state', folder)
          owned.prepare(['execution'])
          component = owned.resolve('execution')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('HA_TEST_EXECUTION=' + str(component.entrypoint) + '\n')
          Path('tested-runtime.json').write_text(json.dumps({'application_commit':os.environ['GITHUB_SHA'],'component_build_run':41234564595,'component_build_commit':'9b03df2014d0b314ca9869d3cc4f24e2b62ceac0','component_sha256':record['sha256']},indent=2)+'\n')
          PY
      - name: Verify actual process and patch operations plus writer recovery
        run: |
          python -m pip install pytest
          python -m pytest tests/test_internal_execution.py tests/test_owned_patching.py tests/test_controller.py tests/test_execution_binding.py tests/test_offline_acceptance_fixture.py -q --junitxml=runtime-regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HA-owned-runtime-evidence-${{ runner.os }}-${{ github.sha }}
          path: |
            runtime-regression.xml
            tested-runtime.json
          retention-days: 14
          if-no-files-found: warn
