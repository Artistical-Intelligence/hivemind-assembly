name: Integrate HA automation assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'dev/ingest_automation.py'
      - '.github/workflows/ingest-automation.yml'
permissions:
  contents: read
concurrency:
  group: ha-automation-ingestion
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build-only compiler without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/ha-compiler" --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Preserve exact licensed inputs
        shell: python
        run: |
          import hashlib, pathlib, urllib.request, zipfile
          inputs = [('opencli', 'jackwener/OpenCLI', '97dc0cd5214b9602bcda78d7422f231ee8a803e9', '3e73b01df9dd35c9d7def08d5b5a15f2e3c34610644ffa16450f82b3c94283db'), ('reach', 'Panniantong/Agent-Reach', '14c213405669414492bda0f8d52cc6531d062c45', '1b6d725a0dfc18be10483abd018427c327c537478c51d0fd0ac531e3fe6c433b')]
          for name, repo, commit, expected in inputs:
              path = pathlib.Path(name + '.zip')
              with urllib.request.urlopen(f'https://codeload.github.com/{repo}/zip/{commit}', timeout=120) as r, path.open('wb') as out:
                  size = 0
                  while chunk := r.read(1024 * 1024):
                      size += len(chunk)
                      if size > 64 * 1024 * 1024: raise RuntimeError('Oversized source')
                      out.write(chunk)
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected: raise RuntimeError('Source hash mismatch')
              root = pathlib.Path('inputs/' + name).resolve(); root.mkdir(parents=True)
              with zipfile.ZipFile(path) as z:
                  if sum(i.file_size for i in z.infolist()) > 256 * 1024 * 1024: raise RuntimeError('Expanded archive too large')
                  for i in z.infolist():
                      if not (root / i.filename).resolve().is_relative_to(root): raise RuntimeError('Unsafe archive path')
                      if (i.external_attr >> 16) & 0o170000 == 0o120000: raise RuntimeError('Unexpected symlink')
                  z.extractall(root)
      - name: Build embedded assets; no browser or upstream application execution
        run: |
          export PATH="$RUNNER_TEMP/ha-compiler/node_modules/.bin:$PATH"
          python dev/ingest_automation.py inputs/opencli/OpenCLI-97dc0cd5214b9602bcda78d7422f231ee8a803e9 inputs/reach/Agent-Reach-14c213405669414492bda0f8d52cc6531d062c45 generated/browser_engine
          python -m compileall -q generated/browser_engine
          find generated -type d -name __pycache__ -prune -exec rm -rf {} +
      - uses: actions/upload-artifact@v4
        with:
          name: ha-browser-engine-${{ github.run_id }}
          path: generated/browser_engine/
          retention-days: 14
          if-no-files-found: error
  retain:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: ha-browser-engine-${{ github.run_id }}
          path: staged-browser-engine
      - name: Preserve local modifications before installing generated assets
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          target = pathlib.Path('_app/hivemind_assembly/automation/browser_engine')
          if target.exists():
              manifest = target / 'manifest.json'
              if not manifest.is_file(): raise RuntimeError('Existing unowned destination')
              for name, digest in json.loads(manifest.read_text())['generated'].items():
                  path = target / name
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest: raise RuntimeError('Reconcile local browser-engine changes first')
          source = pathlib.Path('staged-browser-engine')
          if not (source / 'manifest.json').is_file() or not (source / 'STATUS.md').is_file(): raise RuntimeError('Incomplete artifact')
          for path in source.rglob('*'):
              if path.is_file():
                  dst = target / path.relative_to(source); dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, dst)
      - name: Retain each changed source file; no force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HA source integration'
          git config user.email '193562052+Artistical-Intelligence@users.noreply.github.com'
          target='_app/hivemind_assembly/automation/browser_engine'
          git add "$target/STATUS.md"
          if ! git diff --cached --quiet; then
            git commit -m 'Mark embedded automation pending independent checks'
            git push origin HEAD:main
          fi
          while IFS= read -r -d '' path; do
            git add -- "$path"
            if ! git diff --cached --quiet; then
              git commit -m "Retain HA automation source: ${path##*/}"
              git push origin HEAD:main
            fi
          done < <(find "$target" -type f -print0 | sort -z)
